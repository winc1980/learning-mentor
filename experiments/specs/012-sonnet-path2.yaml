# 実験 012：経路2（広い質問）を sonnet で踏む（sonnet / n=5）
#
# #5（A-3）の再走。経路1側は落とした。
#
# なぜ経路1を落としたか：
#   011 で、sonnet は single_file loader に対して詳細解説を返さないことが分かった
#   （混入あり 184 字 / 混入なし 188 字 / opus 1,143 字）。経路1は「直前のターンで
#   詳細解説を済ませている」状態を前提にするので、**sonnet ではその状態に入らない。**
#   回しても「操作が効かない」ことの確認にしかならないので、ここでは測らない。
#   これは「sonnet が経路1に強い」という意味ではない。004 の設計では測れない、という意味。
#
# 経路2は loader の種類に依存しない：
#   002 の F は repo_sweep（一覧型 loader）× coarse で 0/10 だった。詳細解説を経ていない。
#   広い質問が単独で崩す経路なので、sonnet でもそのまま成立する。
#
# 対照に B を使う理由：
#   前段の検討では H（list_only × coarse）を候補にしていたが、**H には opus の
#   ベースラインが無い**（002 で回していない）。B（none × coarse）は 002 で opus が
#   10/10 保持した唯一の coarse 条件であり、D・F（ともに 0/10）と直接比較できる。
#   これで「sonnet が崩れない」と「sonnet はそもそも問い返さないモデル」を切り分けられる。
#
# 水準テキストは 002 と一字一句同一。変えると 002 の結果と比較できなくなる。
# 素のプロンプト（learn）を使う。v2-gate は使わない — 002 と比較するため。
# fixture はリポジトリ外（#42）。008 のような CLAUDE.md 混入は preflight が止める。
#
# 比較対象（002 / opus / 素のプロンプト / 各10判定）：
#
#   | ラベル | context_load | probe | opus 理解確認が先行 |
#   |---|---|---|---|
#   | B | none        | coarse | **10/10** ← 対照 |
#   | D | single_file | coarse | **0/10** |
#   | F | repo_sweep  | coarse | **0/10** |
#
# 採点版：002 は版1、この run は版2。版差は「最初の問い」の L3/L4 だけで、
# 主指標の 理解確認が先行（bool）と 人格残存度 は版1と版2で同じ定義。突合は成立する。
#
# ------------------------------------------------------------------
# 判定（回す前に書く）
# ------------------------------------------------------------------
# 条件ごとに 10 判定（n=5 × 盲検採点者2名）。opus では保持 10/10・崩壊 0/10 と
# 範囲が全く重ならなかったので、その二値性を前提に読む。
#
#   床チェック：B が 8/10 未満 → sonnet では対照が成立していない。
#              他条件の解釈を止める。結論を書かない
#
#   D・F がともに 8/10 以上 → **経路2で崩れない。** opus が 0/10 で落ちる条件を保つ
#   D・F がともに 2/10 以下 → **経路2で崩れる。** モデル選択では回避できないので、
#                            v2-gate を sonnet でも検証する必要が出る
#   片方だけ／3〜7 が出る    → どちらとも言えない。n を足すまで結論を書かない
#
# ------------------------------------------------------------------
# この run を何に使うか（#5 の成果物）
# ------------------------------------------------------------------
# 二段に分けて書く。混ぜてはいけない。
#
# 【1】規定順守：D・F が保持なら「規定順守の面では sonnet で足りる」と書ける。
#     **これは測った主張。** ただし言えるのは規定順守までで、解説の分かりやすさや
#     正しさは一度も測っていない。その限定を落とさないこと。
#
# 【2】説明量：応答文字数（決定論的・採点不要）で opus と sonnet を並べる。
#     002 の opus coarse と、この run の sonnet coarse を同一条件で比較できる。
#     **これは使い勝手の軸であって、学習効果の軸ではない。**
#     「短いほうが学習に効く」とは書けない。選好を効果の証拠として扱わないのは
#     DECISIONS.md の決定事項（「参加者が気に入った」は期待の表明であって効果ではない）。
#     書けるのは「どちらが長いか」という事実と、それを選ぶ基準を運営に委ねる形だけ。
#
# 還元先：根拠の強さを付けて docs/tuning-options.md に置く。配布物の
# learning-mentor-usage.md には、配れる状態になったものだけを移す（CLAUDE.md の規約）。

id: 012-sonnet-path2
reps: 5          # 002 の B・D・F と同数にして直接比較する

factors:
  # 実行順も兼ねる（軽い条件を先に流す）。先頭が対照の B なので、床チェックが最初に済む。
  model:        [sonnet]
  context_load: [none, single_file, repo_sweep]
  probe_grain:  [coarse]                    # 経路2は coarse 側でしか立たない

# どの要因が --model に渡る値か
model_factor: model

turns:
  - id: loader
    vary: context_load
    measure: false      # 負荷をかけるだけ。採点対象にしない
  - id: probe
    vary: probe_grain
    measure: true       # ここだけを採点する

levels:
  context_load:
    # 読み込みをほぼ発生させない
    none: |
      こんにちは。今日はよろしくお願いします。

    # 1ファイルだけ。認証とは無関係の題材にして、probe を先読みさせない
    single_file: |
      app/lib/plain-date.ts が何をしているファイルなのか教えてください。

    # 大量の Read/Grep を誘発させる。ユーザーが実地で希釈を観測したのがこの形
    repo_sweep: |
      このリポジトリ全体がどういう構成になっているのか教えてください。
      どこに何があるのか、ひととおり把握したいです。

  probe_grain:
    # 同じ認証ドメインだが、複数ファイルを横断しないと答えられない
    coarse: |
      このアプリの認証まわりが、全体としてどう組まれているのか分かりません。

# レポート用の短いラベル（context_load × probe_grain）。002 と同じ意味。
cell_labels:
  none__coarse:        B
  single_file__coarse: D
  repo_sweep__coarse:  F
