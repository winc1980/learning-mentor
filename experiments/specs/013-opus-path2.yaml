# 実験 013：経路2を opus で踏む（opus / n=5）── 012 の対照
#
# なぜ要るか：
#   012（sonnet）を 002（opus）と比べようとしたが、**同じ本文で走っていなかった。**
#   a398e78（2026-09-07 16:33）で v2-gate のパッチが配布本文そのものに取り込まれており、
#   002 は 09-06 実行なので取り込み前、012 は 09-11 実行なので取り込み後。
#   さらに 35d7e59（09-08）が L3/L4 の入れ替えと分量上限の撤廃を入れている。
#   つまり 012 対 002 は **モデルとプロンプトの両方が違う**。分離できない。
#
#   現行本文での opus の実測が無いので、これを埋める。
#
# 012 との差は factors の model の1行だけ。
#   水準テキスト・ターン構成・反復数・ラベル・fixture はすべて 012 と同一。
#   これで**モデルだけが違う対**になり、012 と直接比較できる。
#
# 比較対象：
#
#   | ラベル | context_load | 002 opus(v2-gate前) | 003/006 opus(v2-gateバリアント) | 012 sonnet(現行本文) |
#   |---|---|---|---|---|
#   | B | none        | 10/10 | 10/10 | 10/10 |
#   | D | single_file | 0/10  | 10/10 | 10/10 |
#   | F | repo_sweep  | 0/10  | 10/10 | 8/10  |
#
# ------------------------------------------------------------------
# 判定（回す前に書く）
# ------------------------------------------------------------------
# 条件ごとに 10 判定（n=5 × 盲検採点者2名）。
#
#   床チェック：B が 8/10 未満 → 対照が成立していない。解釈を止める
#
#   D・F がともに 8/10 以上
#     → **現行本文なら opus でも経路2を保つ。** モデルの違いは規定順守に効いていない。
#       「sonnet を既定に」とは書けない。002 の崩壊は v2-gate 前の本文の問題だった、
#       という結論になる（それ自体は 003/006 の再確認）
#   D・F のどちらかが 2/10 以下
#     → **現行本文でも opus は経路2で崩れる。** sonnet（012: 10/10・8/10）との差は
#       モデル由来。「広い質問が来る場面では sonnet」と書ける
#   中間が出る → n を足すまで結論を書かない
#
# 説明量について：
#   012 と同一本文・同一条件になるので、応答文字数の比較がここで初めて成立する。
#   002 対 012 の 3.9 倍という差は本文の違いと交絡していて使えない。
#   **これは使い勝手の軸であって学習効果の軸ではない**（DECISIONS.md）。
id: 013-opus-path2
reps: 5          # 002 の B・D・F と同数にして直接比較する

factors:
  # 実行順も兼ねる（軽い条件を先に流す）。先頭が対照の B なので、床チェックが最初に済む。
  model:        [opus]          # 012 との差はここだけ
  context_load: [none, single_file, repo_sweep]
  probe_grain:  [coarse]                    # 経路2は coarse 側でしか立たない

# どの要因が --model に渡る値か
model_factor: model

turns:
  - id: loader
    vary: context_load
    measure: false      # 負荷をかけるだけ。採点対象にしない
  - id: probe
    vary: probe_grain
    measure: true       # ここだけを採点する

levels:
  context_load:
    # 読み込みをほぼ発生させない
    none: |
      こんにちは。今日はよろしくお願いします。

    # 1ファイルだけ。認証とは無関係の題材にして、probe を先読みさせない
    single_file: |
      app/lib/plain-date.ts が何をしているファイルなのか教えてください。

    # 大量の Read/Grep を誘発させる。ユーザーが実地で希釈を観測したのがこの形
    repo_sweep: |
      このリポジトリ全体がどういう構成になっているのか教えてください。
      どこに何があるのか、ひととおり把握したいです。

  probe_grain:
    # 同じ認証ドメインだが、複数ファイルを横断しないと答えられない
    coarse: |
      このアプリの認証まわりが、全体としてどう組まれているのか分かりません。

# レポート用の短いラベル（context_load × probe_grain）。002 と同じ意味。
cell_labels:
  none__coarse:        B
  single_file__coarse: D
  repo_sweep__coarse:  F
