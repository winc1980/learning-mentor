# 実験 011：CLAUDE.md 混入が loader の字数に効いていたかだけを見る（sonnet / n=3）
#
# 何のための run か：
#   008（sonnet）で、single_file loader の応答が 184 字しかなかった。004（opus）の
#   1,143 字に対して桁が違う。sonnet は loader ターンでも解説せずに前提確認で止まり、
#   経路1が要求する「直前に詳細解説を済ませた状態」に入らなかった。
#
#   ところが 008 は、被験体の文脈にこのリポジトリの CLAUDE.md が混入した状態で
#   走っていた（#42）。CLAUDE.md は役割定義の所在と規定順守を測っていることを
#   書いているので、「解説前に確認する」方向へ押した可能性がある。
#   **モデル差なのか汚染なのかが切り分けられていない。**
#
# 最小構成にした理由：
#   問いは「CLAUDE.md が無くなったら loader の字数が戻るか」の1点。probe ターンは
#   要らないので、1セル1ターンで済む。004（opus）との比較でもない ── モデルが違うと
#   交絡するので、**同じ sonnet・同じ loader 文で、汚染の有無だけを変える**。
#
# 比較対象（008 の single_file loader、CLAUDE.md 混入あり、n=10）：
#   98, 128, 140, 155, 169, 200, 201, 222, 231, 238   → 中央 184 / 最大 238
#   （008 では probe_grain によらず loader 文は同一なので、10本とも同条件の反復）
#
# 判定（回す前に書く）：
#   3本すべてが 238（008 の最大）を超える
#     → 汚染が字数を縮めていた。経路1の操作失敗は CLAUDE.md のせい。
#       #5 は当初の設計どおり C・I を経路1の検証として読める
#   3本すべてが 98〜238（008 の範囲）に収まる
#     → 汚染は字数に効いていない。184 字は sonnet の性質。
#       **sonnet では 004 と同じ意味での経路1が作れない**ということなので、
#       #5 の判定は「経路1に強い」ではなく「経路1の状態に入らない」と書く必要がある
#   混在する
#     → n=3 では足りない。reps を足してから読む。ここで結論を書かない
#
# 字数だけでなく応答本文も残る。008 の loader は「いきなり中身の解説に入る前に、
# 少し状況を確認させてください」で止まっていた。戻った場合にその前置きが消えて
# いるかを、cells/*/response-loader.md で目視すること。
#
# 素のプロンプト（learn）を使う。008 と同じ条件にするため。

id: 011-claude-md-effect
reps: 6          # n=3 で混在したため、判定の規則どおり追加した（回した後に足した）

factors:
  model:        [sonnet]        # 008 と同じモデル。ここを変えると交絡する
  context_load: [single_file]   # 008 で 184 字だった水準。文は 002・004・008 と一字一句同一

model_factor: model

turns:
  # probe を回さない。問いは loader の字数だけなので、ここを採点対象にする。
  - id: loader
    vary: context_load
    measure: true

levels:
  context_load:
    # 002 の single_file、004 の explain_one、008 の single_file と一字一句同一。
    single_file: |
      app/lib/plain-date.ts が何をしているファイルなのか教えてください。
